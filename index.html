<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pinnacle</title>
<meta name="description" content="A quiz climb for two: rope up with a partner and answer your way to the summit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<script>
/* GitHub Pages lets browsers keep every file for ten minutes, so after an update a browser could go on running the
   old game. The game's own files (styles, scripts and art) are fetched with a version that changes every minute
   instead, so an update reaches everyone within a minute or so. */
window.V="v="+Math.floor(Date.now()/6e4);
document.write('<link rel="stylesheet" href="css/style.css?'+V+'">');
</script>
</head>
<body>
<div class="scene" id="scene">
  <canvas id="topo" role="img" aria-label="A rope team climbing a granite cliff from base camp to the summit"></canvas>
  <div class="fx" id="fx" aria-hidden="true"></div>
</div>
<header class="bar" id="bar">
  <h1 class="brand">Pinnacle</h1>
  <div class="team" id="teambar"></div>
  <div class="spacer"></div>
  <button class="linkbtn" id="homeBtn" hidden>Menu</button>
  <button class="ibtn" id="sndBtn" type="button" title="Sound" aria-label="Sound"><svg viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 4h2v4H1zM3 4h1V3h1V2h1v8H5V9H4V8H3z" fill="currentColor"/><path class="on" d="M8 4h1v4H8zM10 2h1v8h-1z" fill="currentColor"/><path class="off" d="M8 4h1v1H8zM9 5h1v2H9zM8 7h1v1H8zM10 4h1v1h-1zM10 7h1v1h-1z" fill="currentColor"/></svg></button>
  <button class="ibtn" id="fsBtn" type="button" title="Fullscreen" aria-label="Fullscreen" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><path class="off" d="M1 1h4v1H2v3H1zM7 1h4v4h-1V2H7zM1 7h1v3h3v1H1zM10 7h1v4H7v-1h3z" fill="currentColor"/><path class="on" d="M4 1h1v4H1V4h3zM7 1h1v3h3v1H7zM1 7h4v4H4V8H1zM7 7h4v1H8v3H7z" fill="currentColor"/></svg></button>
</header>
<main id="main" class="lobby"></main>
<div class="hud" id="hud" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
// the scripts, in order, at this minute's version (written in, so they still load and run one after another)
for(const s of ["content","game","audio","scene","main"])document.write('<script src="js/'+s+'.js?'+V+'"><\/script>');
</script>
</body>
</html>
