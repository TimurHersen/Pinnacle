# Puts database.rules.json live on the Firebase project whenever it changes on main (or when run by hand from the
# Actions tab), after checking it on the emulators. It needs a repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON
# key of a Google Cloud service account with the "Firebase Realtime Database Admin" role (see the README). Without
# it the workflow does nothing.
name: Deploy database rules
on:
  push:
    branches: [main]
    paths: [database.rules.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-rules
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Is there a key to deploy with?
        id: key
        run: |
          if [ -z "$SA" ]; then
            echo "::notice::No FIREBASE_SERVICE_ACCOUNT secret, so the rules were not deployed. Paste them into the Firebase console by hand, or add the secret."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      # rules that ask for a sign-in would lock out a game that never signs in
      - name: The game signs in, if the rules ask it to
        if: steps.key.outputs.skip != '1'
        run: |
          if grep -q 'auth != null' database.rules.json && grep -q 'const FB_KEY="";' js/game.js; then
            echo "::error::database.rules.json asks for a sign-in, but FB_KEY in js/game.js is empty, so the game would be locked out. Fill in the Web API key and turn on Anonymous sign-in in the Firebase console first (see the README)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.key.outputs.skip != '1'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.key.outputs.skip != '1'
        with:
          distribution: temurin
          java-version: 21
      - name: Check the rules on the emulators
        if: steps.key.outputs.skip != '1'
        run: npx --yes firebase-tools@15.36.0 emulators:exec --project pinnacle-5f36a --only database,auth "node test/db.test.js"
      - name: Deploy
        if: steps.key.outputs.skip != '1'
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@15.36.0 deploy --only database --project pinnacle-5f36a --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
